# Continuous integration: build, unit tests and consistency checks on every push and pull request.
# Intel runner (macos-13) because the project targets Intel Macs; the code also builds on Apple Silicon.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Localization consistency
        run: python3 Scripts/check-strings.py

      - name: Property lists
        run: plutil -lint Resources/*.plist Resources/*.lproj/*.strings

      - name: Build
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: Build the app bundle (ad-hoc signed)
        run: ./build.sh
